name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Muhammad-Wasil-Ali
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=0F2027,203A43,2C5364&color_dots=f0f4f8,d4e8f0,a8d8e8,6fc3d8,00C7B7
            dist/github-contribution-grid-snake-dark.svg?color_snake=0F2027,203A43,2C5364&color_dots=f0f4f8,d4e8f0,a8d8e8,6fc3d8,00C7B7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
