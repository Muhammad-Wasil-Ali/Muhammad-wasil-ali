name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Muhammad-Wasil-Ali
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232C5364&color_dots=%23f0f4f8,%23d4e8f0,%23a8d8e8,%236fc3d8,%2300C7B7
            dist/github-contribution-grid-snake-dark.svg?color_snake=%232C5364&color_dots=%23f0f4f8,%23d4e8f0,%23a8d8e8,%236fc3d8,%2300C7B7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
