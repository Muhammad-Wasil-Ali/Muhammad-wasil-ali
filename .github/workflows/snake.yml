name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Muhammad-Wasil-Ali
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00C7B7&color_dots=1e1e2e,383a59,44475a,6272a4,bd93f9
            dist/github-contribution-grid-snake-dark.svg?color_snake=00C7B7&color_dots=1e1e2e,383a59,44475a,6272a4,bd93f9

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
